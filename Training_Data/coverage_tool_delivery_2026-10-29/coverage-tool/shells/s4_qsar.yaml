scenario_name: 分子描述符到活性的预测对比
domain: 化学（QSAR）
skeleton: S4
executable: true
summary: 用分子描述符预测化合物活性，比较基线与回归模型
vocabulary:
  treatment_name: 预测模型
  outcome_name: 活性预测误差
  unit: 依指标而定
  comparison: 模型 vs 基线
survey_questions:
- 化合物数据来源、许可与版本？是否有重复结构？
- 活性数据的测定方法、单位与实验室间差异？
- 描述符如何计算（软件/版本/参数）？是否包含 3D 构象？
- 数据清洗规则（盐、立体化学、无效结构）是什么？
- 划分是否按骨架/scaffold 或相似性分组？随机种子？
- 类别不平衡或活性分布偏态如何处理？
- 适用化学空间（分子量、官能团）如何限定？
- 是否声明仅为计算预测、不做湿实验结论？
rubric:
- 数据来源与许可
- 重复结构检查
- 描述符软件与版本
- 数据清洗规则声明
- 按 scaffold 或相似性分组划分
- 活性单位统一
- 适用域声明
- 不做湿实验结论的声明
proposal_template:
- 研究目标
- 数据与描述符
- 划分
- 模型与基线
- 评价与验收
- 局限
source: 骨架聚类表 v1 · S4 · QSAR 行
notes: 需描述符计算依赖（如 rdkit）；当前以预计算描述符表接入
