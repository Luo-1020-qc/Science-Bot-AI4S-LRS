scenario_name: 助剂组合的析因筛选
domain: 化学（催化）
skeleton: S3
executable: true
summary: 两种助剂对催化剂转化率/选择性的 2×2 析因筛选
vocabulary:
  treatment_name: 助剂 A×助剂 B
  outcome_name: 转化率
  unit: '%'
  comparison: 加入/不加入的组合
survey_questions:
- 两种助剂的加入方式（浸渍/共沉淀）与顺序是什么？
- 催化剂制备批次、负载量与焙烧条件是否一致？
- 反应条件（温度、压力、空速、氢烃比）是否固定并记录？
- 原料纯度与进料组成是否稳定？
- 产物分析与定量标准（GC 柱、内标）是什么？
- 每个组合重复几次？是否独立装填？
- 是否评估失活与再生？单次运行时长多长？
- 期望能检出的最小转化率差异是多少？依据是什么？
rubric:
- 制备批次与负载量一致
- 制备方式与顺序记录
- 反应条件受控并记录
- 进料组成稳定
- 分析标准已声明
- 重复 >= 2 且独立装填
- 失活/再生记录
- 主效应与交互作用分开报告
proposal_template:
- 研究目标
- 催化剂制备
- 反应与检测
- 因子设计
- 验收标准
- 局限
source: 骨架聚类表 v1 · S3 · 催化剂筛选行
notes: 与合成 DOE 壳共享骨架，词汇表不同
