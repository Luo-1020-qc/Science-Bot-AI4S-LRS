scenario_name: 两种训练方案的耐力成绩比较
domain: 体育科学
skeleton: S1
executable: true
summary: 两种训练方案干预后耐力测试成绩的组间比较
vocabulary:
  treatment_name: 训练方案
  outcome_name: 耐力成绩
  unit: 秒
  comparison: 方案 A vs 方案 B
survey_questions:
- 受试者基线水平是否可比？
- 是否随机分配？
- 训练周期与依从性如何记录？
- 测试条件（场地、天气、时间）是否一致？
- 是否有分层因素（性别、年龄、训练史）？
rubric:
- 基线可比性已报告
- 随机分配已声明
- 依从性记录
- 测试条件一致
- 脱落与退出处理
- 效应阈值与最小有意义差异有来源
proposal_template:
- 研究目标
- 受试者与随机化
- 训练与测试协议
- 统计方法
- 验收标准
- 局限
source: 骨架聚类表 v1 · S1 · 体育科学行
notes: 运动科学壳的重点是依从性与测试条件控制
