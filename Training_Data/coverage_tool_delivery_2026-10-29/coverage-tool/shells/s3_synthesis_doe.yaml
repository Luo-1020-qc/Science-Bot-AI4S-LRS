scenario_name: 合成参数对产率的因子设计
domain: 化学/材料
skeleton: S3
executable: true
summary: 温度与时间两因子两水平（可扩展）对产率的影响，含随机化与区组
vocabulary:
  treatment_name: 合成条件（温度 × 时间）
  outcome_name: 产率
  unit: '%'
  comparison: 温度 {低, 高} × 时间 {短, 长} 的全因子组合
survey_questions:
- 合成路线的关键因子有哪些？为什么选温度×时间（或其它组合）作为因子？
- 因子的可行域与水平如何选定？是否有工艺或安全约束（溶剂沸点、压力上限）？
- 是否需要区组（原料批次、操作员、反应釜位号）？区组如何划分与随机化？
- 试验顺序如何安排？是否需要中心点或重复点？
- 每个处理组合重复几次？重复之间是否独立（不同批次/不同天）？
- 产率如何测量（GC/HPLC/称重）？定量方法与误差来源是什么？
- 产物纯度或副产物是否需要同时记录？
- 期望的最小效应是多少（百分点）？依据是什么？
rubric:
- 因子与水平有可行域依据（文献或预实验）
- 随机化与区组方案已声明
- 试验顺序与中心点/重复点安排已声明
- 每个组合重复 >= 2 且独立
- 产率测定方法与误差来源记录
- 纯度/副产物记录（如适用）
- 功效/方差依据有来源（不得用默认值冒充）
- 安全约束已声明
proposal_template:
- 研究目标与因子假设
- 因子、水平与可行域
- 随机化与区组计划
- 重复与资源预算
- 分析方法（2×2 全因子 / RCBD）
- 验收标准、容差与停止规则
source: 骨架聚类表 v1 · S3 · 合成化学行（做深首推）
notes: 与现有 G2.4 的三种 DOE 模板直接对应，是"做深一个学科"的最佳落点
