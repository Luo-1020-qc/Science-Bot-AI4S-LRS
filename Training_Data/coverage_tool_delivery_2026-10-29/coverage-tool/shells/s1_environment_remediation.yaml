scenario_name: 两种修复方案的污染物去除率比较
domain: 环境科学
skeleton: S1
executable: true
summary: 两种修复技术对同一污染介质的去除率对比
vocabulary:
  treatment_name: 修复方案
  outcome_name: 去除率
  unit: '%'
  comparison: 方案 A vs 方案 B
survey_questions:
- 污染介质是否同源同批？
- 初始浓度是否可比？
- 修复条件（时间、温度、投加量）是否一致？
- 每个方案几个独立处理单元？
- 去除率如何计算？
rubric:
- 介质同源与初始浓度可比
- 修复条件一致
- 独立处理单元 >= 3
- 去除率计算规则
- 空白对照
- 不做现场规模外推的声明
proposal_template:
- 研究目标
- 介质与初始条件
- 修复协议
- 统计方法
- 验收标准
- 局限
source: 骨架聚类表 v1 扩展 · S1 · 环境科学
notes: 初始浓度差异是常见混杂来源
