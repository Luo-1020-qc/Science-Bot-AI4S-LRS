scenario_name: 两种灌溉方式的作物产量比较
domain: 农学
skeleton: S1
executable: true
summary: 滴灌与漫灌两种方式下的单位面积产量对比，小区独立
vocabulary:
  treatment_name: 灌溉方式
  outcome_name: 产量
  unit: kg/亩
  comparison: 滴灌 vs 漫灌
survey_questions:
- 各处理的小区是否独立？小区面积与形状如何？
- 土壤本底（肥力、含水量）是否存在系统差异？是否需要区组？
- 生育期内的天气与病虫害如何记录？
- 重复几次？是否随机分配处理？
- 产量如何测定（实收 / 取样折算）？
rubric:
- 小区独立性与面积已声明
- 必要时使用区组与随机化
- 重复次数 >= 3
- 产量测定方法与折算规则一致
- 天气、土壤与病虫害作为协变量记录
- 不将单点结果外推为区域结论
proposal_template:
- 研究目标与假设
- 小区设计与随机化/区组
- 采样与测产计划
- 统计方法（Welch t 或区组分析）
- 验收标准与容差
- 局限（天气、土壤异质性）
source: 骨架聚类表 v1 · S1 · 农学行
notes: 农学场景的重点是田间异质性，不是统计公式
