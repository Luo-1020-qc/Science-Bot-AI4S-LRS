scenario_name: 两种配方材料的抗拉强度比较
domain: 材料科学
skeleton: S1
executable: true
summary: 同一测试标准下配方 A 与配方 B 的抗拉强度对比，试样独立制备
vocabulary:
  treatment_name: 材料配方
  outcome_name: 抗拉强度
  unit: MPa
  comparison: 配方 A vs 配方 B
survey_questions:
- 两种配方的具体差异是什么？原料批次与前处理是否一致？
- 试样如何制备？两组试样是否独立？是否共享同一批原料？
- 试样尺寸、加工方式与取样方向（轧向/横向）是否一致？
- 拉伸测试依据哪个标准（ASTM E8 / GB/T 228 / ISO 6892）？加载速率与引伸计是否一致？
- 试验环境的温度与湿度是否记录？
- 每组独立试样数是多少？同一试样是否重复测试？
- 断口位置（标距内/外）与缺陷试样如何判定与处理？
- 抗拉强度如何取值（最大值/规定塑性延伸）？测量精度是多少？
- 期望能检出的最小差异是多少（MPa 或 %）？依据是什么？
rubric:
- 配方定义与批次已声明
- 取样方向与试样尺寸一致
- 测试标准、加载速率与引伸计已记录
- 每组独立试样数 >= 3
- 断口位置判定规则事先声明
- 异常试样处理规则事先声明
- 效应阈值有来源说明
- 统计方法（Welch t；方差不齐或偏态时非参备选）
proposal_template:
- 研究目标与可检验假设
- 配方定义与试样制备
- 重复与采样计划
- 测试标准与统计方法
- 验收标准与容差
- 风险、局限与不做因果推广的声明
source: 骨架聚类表 v1 · S1 · 材料科学行
notes: 与化学催化剂壳同构，可作跨学科词汇表对照示范
