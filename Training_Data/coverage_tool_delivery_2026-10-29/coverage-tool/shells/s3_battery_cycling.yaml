scenario_name: 充放电参数与循环次数对容量保持的影响
domain: 电池/能源
skeleton: S3
executable: true
summary: 充电倍率与放电深度两因子对容量保持率的影响，含循环重复
vocabulary:
  treatment_name: 充放电参数（倍率 × 放电深度）
  outcome_name: 容量保持率
  unit: '%'
  comparison: 倍率 {低, 高} × 放电深度 {浅, 深} 的组合
survey_questions:
- 因子与水平如何选定？是否在电芯规格与设备允许范围内？
- 电芯来源、批次与化成状态是否一致？初始容量如何标定？
- 循环温度如何控制（环境箱精度）？
- 充放电截止条件（电压/电流/C-rate）与静置时间是什么？
- 测试通道是否校准？通道间差异如何评估？
- 每个参数组合用几个电芯？循环到多少圈或何种终止条件？
- 容量保持率如何计算（相对初始容量/额定容量）？
- 是否有安全约束（过充/过放/热失控防护）与异常中止规则？
rubric:
- 因子水平在规格可行域内
- 电芯批次与化成状态一致
- 初始容量标定方法
- 循环温度、截止条件已记录
- 通道校准与通道差异评估
- 每个组合重复电芯数 >= 2
- 容量保持率计算规则
- 安全约束与异常中止规则
proposal_template:
- 研究目标与因子假设
- 电芯来源与一致性检查
- 循环协议（温度、截止条件、圈数）
- 重复与资源预算
- 统计方法（因子设计 / 曲线对比）
- 安全约束与验收标准
source: 骨架聚类表 v1 · S3 · 电池/能源行
notes: 涉及安全约束的学科壳，survey 中必须强制询问
