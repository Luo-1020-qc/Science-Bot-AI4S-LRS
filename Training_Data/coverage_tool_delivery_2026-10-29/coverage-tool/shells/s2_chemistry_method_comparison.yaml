scenario_name: 两种检测方法对同批样品的测定值比较
domain: 分析化学
skeleton: S2
executable: true
summary: 同批样品用方法 A 与方法 B 各测一次，比较系统偏差
vocabulary:
  treatment_name: 检测方法
  outcome_name: 测定值
  unit: 依分析物而定（如 mg/L）
  comparison: 方法 A vs 方法 B（同一样品）
survey_questions:
- 样品同质性如何保证？取样与分装是否一致？
- 两种方法各自依据什么标准？版本是什么？
- 每种方法重复测量几次？
- 检出限与定量限是多少？
- 是否存在基质效应或交叉污染风险？
rubric:
- 样品同质性与分装已声明
- 方法标准与版本已记录
- 每样品每方法重复 >= 3
- 检出限/定量限已声明
- 配对完整性已检查
- 偏差分析与一致性界限（如 Bland-Altman）方法匹配
proposal_template:
- 研究目标（方法可比性）
- 样品与分装
- 两种方法的操作与标准
- 统计方法（配对 t / 一致性分析）
- 验收标准（允许偏差）
- 局限（基质效应、操作者差异）
source: 骨架聚类表 v1 · S2 · 分析化学行
notes: 方法比对场景：重点是一致性而非简单显著性
