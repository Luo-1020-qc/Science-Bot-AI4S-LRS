scenario_name: 三种充电协议的容量保持比较
domain: 电池/能源
skeleton: S5
executable: false
summary: 三种充电协议下循环容量保持率的多组比较
vocabulary:
  treatment_name: 充电协议
  outcome_name: 容量保持率
  unit: '%'
  comparison: 协议 A / B / C
survey_questions:
- 三种协议的具体差异（倍率/截止条件）？
- 电芯来源、批次与化成状态是否一致？
- 循环温度与设备通道是否受控/校准？
- 每种协议几个电芯？
- 循环终止条件是什么？
- 是否有安全约束与异常中止规则？
rubric:
- 协议定义清晰
- 电芯批次与化成一致
- 温度与截止条件记录
- 通道校准与通道差异
- 每种协议电芯数 >= 2
- 容量计算规则一致
- 安全约束
- 多重性校正声明
proposal_template:
- 研究目标
- 协议定义
- 电芯与循环
- 统计方法
- 验收标准
- 局限
