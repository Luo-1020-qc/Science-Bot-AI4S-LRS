scenario_name: 两种涂层的耐磨性比较
domain: 材料科学
skeleton: S1
executable: true
summary: 两种涂层在相同磨损试验条件下的磨损量对比
vocabulary:
  treatment_name: 涂层
  outcome_name: 磨损量
  unit: mg
  comparison: 涂层 A vs 涂层 B
survey_questions:
- 两种涂层的配方或工艺差异具体是什么？除涂层外，基材与前处理是否一致？
- 涂层厚度如何控制与测量？两组厚度是否可比？
- 磨损试验依据哪个标准（如 ASTM G99 / G65）？对磨件材质、载荷、转速或行程是什么？
- 试验环境的温度、湿度，以及润滑或磨料条件是否一致？
- 每组准备几个独立试样？同一试样是否重复测量？
- 磨损量如何测量（失重法 / 体积法 / 轮廓仪）？测量精度是多少？
- 是否有预磨（跑合）阶段？试验时长如何确定？
- 异常试样（涂层剥落、崩边）如何判定与处理？
- 期望能检出的最小差异是多少（mg 或 %）？依据是什么？
rubric:
- 基材与厚度一致
- 对磨件一致性
- 试验标准与参数记录
- 预磨阶段声明
- 每组试样 >= 3
- 测量方法一致
- 异常试样处理
- 效应阈值有来源
proposal_template:
- 研究目标
- 试样与涂层
- 磨损试验
- 统计方法
- 验收标准
- 局限
source: 骨架聚类表 v1 扩展 · S1 · 材料科学
notes: 涂层厚度不一致会直接掩盖配方差异
