scenario_name: 材料成分到屈服强度的预测对比
domain: 材料信息学
skeleton: S4
executable: true
summary: 用成分特征预测屈服强度，比较基线模型与正则化模型在冻结测试集上的误差
vocabulary:
  treatment_name: 预测模型（mean 基线 vs ridge）
  outcome_name: 预测误差（MAE / 相对 L2）
  unit: 无量纲
  comparison: 模型 vs 基线
survey_questions:
- 数据来源、许可与版本是什么？能否提供数据哈希？
- 样本量与目标分布如何？是否存在重复或近重复样本？
- 特征如何定义（元素含量、工艺条件是否包含）？是否与目标同时测定？
- 目标值的单位与测定标准是什么？
- 训练/验证/测试如何划分？是否按来源组/家族分组？随机种子是否固定？
- 预处理（标准化/缺失填补）是否只在训练集拟合？
- 测试集是否只使用一次？模型选择是否只依据验证集？
- 适用域如何界定（成分/工艺范围）？外推如何声明？
rubric:
- 数据来源、哈希与许可已声明
- 重复/近重复样本检查
- 划分固定且测试集只用一次
- 预处理只在训练集拟合
- 特征不含目标泄漏
- 模型选择仅依据验证集
- 基线（mean）与候选模型使用相同划分
- 报告误差与不确定区间，不声称因果
proposal_template:
- 研究目标与预测假设
- 数据来源与特征定义
- 划分与预处理协议
- 模型与基线
- 评价指标与验收标准
- 局限（适用域、外推风险）
source: 骨架聚类表 v1 · S4 · 材料信息学行（matbench_steels 候选）
notes: 直接对应提案任务 A 的候选数据集，答辩时可与 Darcy 并列展示
