scenario_name: 多批次制剂溶出度比较
domain: 药学
skeleton: S5
executable: false
summary: 三个及以上批次制剂的溶出度曲线/终点比较
vocabulary:
  treatment_name: 批次
  outcome_name: 溶出度
  unit: '%'
  comparison: 批次 A / B / C
survey_questions:
- 批次数量与抽样方式？
- 溶出介质、体积与转速是否一致？
- 取样时间点如何设置？
- 每批多少个独立样品？
- 批次应作为固定效应还是随机效应？
- 检测方法是否经过验证？
rubric:
- 批次抽样代表性
- 溶出条件一致并记录
- 取样时间点覆盖充分
- 方法验证状态
- 固定/随机效应声明
- 多重性校正声明
- 不做生物等效性结论
proposal_template:
- 研究目标
- 批次与抽样
- 溶出条件
- 统计方法（ANOVA/混合模型）
- 验收标准
- 局限
source: 骨架聚类表 v1 · S5 · 药学行
notes: 不可执行：S5 待开发。批次效应模型选择是审阅重点
