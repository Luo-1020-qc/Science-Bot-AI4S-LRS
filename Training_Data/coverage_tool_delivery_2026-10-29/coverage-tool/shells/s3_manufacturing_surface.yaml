scenario_name: 切削参数对表面粗糙度的影响
domain: 制造/工艺
skeleton: S3
executable: true
summary: 切削速度与进给量两因子对表面粗糙度 Ra 的影响，含随机化顺序
vocabulary:
  treatment_name: 切削参数（速度 × 进给量）
  outcome_name: 表面粗糙度
  unit: μm (Ra)
  comparison: 速度 {低, 高} × 进给 {小, 大} 的组合
survey_questions:
- 机床、刀具与工件材料批次是否一致？
- 参数水平的可行域依据是什么（手册 / 预实验）？
- 粗糙度测量仪器、取样长度与评定长度是什么？
- 冷却/润滑条件是否固定？
- 试验顺序是否随机化？刀具磨损如何控制？
rubric:
- 因子水平在机床与刀具允许范围内
- 刀具磨损与批次已控制或记录
- 测量标准、取样长度与评定长度已声明
- 试验顺序随机化或区组化
- 每个组合重复 >= 2
- 异常值处理规则事先声明
proposal_template:
- 研究目标与因子假设
- 设备、刀具与工件条件
- 试验顺序与随机化
- 测量与统计方法
- 资源预算与验收标准
- 局限（刀具磨损、环境振动）
source: 骨架聚类表 v1 · S3 · 制造/工艺行
notes: 随机化顺序是制造类 DOE 的审阅重点
