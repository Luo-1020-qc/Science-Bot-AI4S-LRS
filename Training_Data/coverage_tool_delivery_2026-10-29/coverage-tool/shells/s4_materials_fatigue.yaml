scenario_name: 工艺参数到疲劳寿命的预测对比
domain: 材料科学
skeleton: S4
executable: true
summary: 用工艺与微观结构特征预测疲劳寿命，比较基线与回归模型
vocabulary:
  treatment_name: 预测模型
  outcome_name: 疲劳寿命预测误差
  unit: 循环数（对数）
  comparison: 模型 vs 基线
survey_questions:
- 数据来源、材料体系与试样数量？
- 疲劳试验条件（应力比、频率、波形、环境）是否一致？
- 寿命数据是否截尾（未失效/中止）？截尾比例多少？
- 特征包含哪些工艺/组织参数？是否与寿命同时获得？
- 划分是否按批次/炉号分组？随机种子？
- 是否使用对数寿命建模？单位与底数？
- 应力水平是否作为特征或分层变量？外推范围？
- 是否声明不做安全寿命认定或设计许用值？
rubric:
- 按批次分组划分
- 试验条件一致并记录
- 截尾数据处理与比例声明
- 对数变换与单位
- 应力水平处理方式
- 基线一致
- 适用域声明
- 不做安全寿命认定的声明
proposal_template:
- 研究目标
- 数据与特征
- 划分与时序
- 模型与基线
- 评价与验收
- 局限
source: 骨架聚类表 v1 扩展 · S4 · 材料科学
notes: 疲劳寿命常含截尾，需专门说明
