scenario_name: 两种饲料配方的增重效果比较
domain: 农学（畜牧）
skeleton: S1
executable: true
summary: 两种饲料配方下动物平均日增重的组间比较
vocabulary:
  treatment_name: 饲料配方
  outcome_name: 平均日增重
  unit: g/天
  comparison: 配方 A vs 配方 B
survey_questions:
- 动物来源、品种与初始体重是否可比？
- 圈舍与分组如何安排？
- 饲养周期与投喂量？
- 是否有疾病或淘汰记录？
- 每组多少头/只？
rubric:
- 初始体重可比
- 分组与圈舍安排声明
- 饲养条件一致
- 疾病淘汰记录
- 每组动物数 >= 10（或功效依据）
- 不做过量外推的声明
proposal_template:
- 研究目标
- 动物与分组
- 饲养与记录
- 统计方法
- 验收标准
- 局限
source: 骨架聚类表 v1 扩展 · S1 · 农学
notes: 动物试验的伦理与淘汰记录必须声明
