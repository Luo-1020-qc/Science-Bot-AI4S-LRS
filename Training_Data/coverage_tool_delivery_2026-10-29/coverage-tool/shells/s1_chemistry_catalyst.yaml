scenario_name: 两种催化剂的产率比较
domain: 化学
skeleton: S1
executable: true
summary: 同一反应条件下催化剂 A 与催化剂 B 的产率对比，批次相互独立

vocabulary:
  treatment_name: 催化剂
  outcome_name: 产率
  unit: "%"
  comparison: 催化剂 A vs 催化剂 B

survey_questions:
  - 两批实验是否使用独立配制的反应体系？
  - 每组重复了几批次？批次之间是否共享同一批原料？
  - 产率如何测定（GC / HPLC / 称重）？单位是否统一？
  - 除催化剂外，温度、时间、溶剂、投料比是否保持一致？
  - 是否存在未记录或异常的批次？如何处理？

rubric:
  - 对照组或基线已定义（或明确声明无基线）
  - 每组独立重复次数 >= 3
  - 产率测定方法与单位一致且已声明
  - 催化剂以外的条件受控并记录
  - 异常批次与缺失值的处理规则事先声明
  - 效应阈值（多少百分点的产率差才有实际意义）有来源说明

proposal_template:
  - 研究目标与可检验假设
  - 处理定义与实验单位
  - 重复与采样计划
  - 统计方法（Welch t；方差不齐或偏态时的非参备选）
  - 验收标准与容差
  - 风险、局限与不做因果推广的声明

source: 骨架聚类表 v1 · S1 · 化学行（做宽首推）
notes: 词汇表简单、rubric 稳定，适合作为学科壳模板的示范案例
