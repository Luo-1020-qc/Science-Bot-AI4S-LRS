scenario_name: 新药与安慰剂的疗效比较
domain: 临床医学
skeleton: S1
executable: true
summary: 随机对照试验中治疗组与安慰剂组主要终点的组间比较
vocabulary:
  treatment_name: 治疗组
  outcome_name: 主要终点变化值
  unit: 依指标而定
  comparison: 新药 vs 安慰剂
survey_questions:
- 随机化与盲法如何实施？
- 主要终点是什么？测量时间点如何统一？
- 样本量与预期效应如何确定（功效分析）？
- 脱落与退出如何处理？
- 合并用药或同期治疗是否记录？
rubric:
- 随机化与盲法已声明
- 主要终点预注册且测量时点一致
- 样本量/功效依据有来源
- 两组基线可比性已报告
- 脱落处理事先声明
- 统计显著与临床意义分开声明
proposal_template:
- 研究目标与假设
- 随机化与盲法
- 主要终点与测量
- 样本量与功效
- 统计方法
- 伦理、脱落与局限
source: 骨架聚类表 v1 · S1 · 临床医学行
notes: RCT 话术边界：只声称组间差异，不声称机制或普适疗效
